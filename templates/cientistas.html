<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cientistas</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan:   #67E8F9;
    --gold:   #F59E0B;
    --white:  #F0F4FF;
    --glass:  rgba(8, 14, 35, 0.60);
    --border: rgba(103, 232, 249, 0.12);
}

html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100dvh;
    background: radial-gradient(ellipse 120% 100% at 60% 110%,
                    #0d1b4b 0%, #080e28 40%, #04060f 100%);
    color: var(--white);
    padding-top: env(safe-area-inset-top);
}

/* Canvas de estrelas */
#stars-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

/* Névoa */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 55% 60% at 20% 40%, rgba(107,33,168,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(14,60,140,0.14) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
}

/* ── Cabeçalho da página ── */
.page-header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 52px 20px 36px;
    border-bottom: 1px solid var(--border);
    background: rgba(4, 8, 22, 0.30);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.page-eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
    animation: fadeUp 0.7s ease 0.1s both;
}

.page-eyebrow-line {
    width: 40px; height: 1px;
    background: linear-gradient(to right, transparent, var(--cyan));
    opacity: 0.5;
}
.page-eyebrow-line.right {
    background: linear-gradient(to left, transparent, var(--cyan));
}

.page-eyebrow span {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--cyan);
    opacity: 0.8;
}

#tituloPagina {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 52px);
    color: var(--white);
    letter-spacing: 0.5px;
    animation: fadeUp 0.8s ease 0.25s both;
}

#tituloPagina em {
    font-style: italic;
    font-weight: 300;
    color: var(--gold);
}

.page-desc {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 300;
    color: rgba(240,244,255,0.45);
    letter-spacing: 0.3px;
    animation: fadeUp 0.8s ease 0.40s both;
}

/* ── Botão voltar no topo ── */
.btn-voltar-topo {
    position: absolute;
    top: 50%; left: 28px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 15px;
    background: rgba(103,232,249,0.07);
    border: 1px solid rgba(103,232,249,0.20);
    border-radius: 10px;
    color: var(--cyan);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, transform 0.25s;
    text-decoration: none;
    animation: fadeUp 0.7s ease 0.15s both;
    z-index: 20;
}

.btn-voltar-topo:hover {
    background: rgba(103,232,249,0.14);
    border-color: rgba(103,232,249,0.40);
    transform: translateY(calc(-50% - 2px));
}

/* ── Grid de cards ── */
.container {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 0 60px;
}

.lista-cientistas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.card-cientista {
    background: rgba(10, 18, 45, 0.65);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 22px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    animation: fadeCard 0.45s ease both;
}

.card-cientista:nth-child(1) { animation-delay: 0.05s; }
.card-cientista:nth-child(2) { animation-delay: 0.10s; }
.card-cientista:nth-child(3) { animation-delay: 0.15s; }
.card-cientista:nth-child(4) { animation-delay: 0.20s; }
.card-cientista:nth-child(5) { animation-delay: 0.25s; }
.card-cientista:nth-child(6) { animation-delay: 0.30s; }

@keyframes fadeCard {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* brilho no canto superior direito */
.card-cientista::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(103,232,249,0.10), transparent 70%);
    transition: opacity 0.3s;
    opacity: 0;
    pointer-events: none;
}

.card-cientista:hover {
    transform: translateY(-6px);
    border-color: rgba(103,232,249,0.30);
    box-shadow:
        0 12px 40px rgba(0,0,0,0.35),
        0 0 0 1px rgba(103,232,249,0.08);
}

.card-cientista:hover::before { opacity: 1; }

/* tag da área */
.card-area-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.22);
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
}

.card-cientista h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 6px;
}

.card-cientista p {
    font-size: 12px;
    font-weight: 300;
    color: rgba(240,244,255,0.45);
    margin-bottom: 16px;
}

.card-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--cyan);
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.65;
    transition: opacity 0.22s, gap 0.22s;
}

.card-cientista:hover .card-cta { opacity: 1; gap: 9px; }

.card-cta-arrow { font-size: 13px; }

/* ── Modal ── */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 5, 15, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-conteudo {
    width: 100%;
    max-width: 820px;
    max-height: 90dvh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(103,232,249,0.2) transparent;

    background: rgba(8, 14, 38, 0.96);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    position: relative;

    box-shadow:
        0 0 60px rgba(103,232,249,0.07),
        0 30px 80px rgba(0,0,0,0.6);

    animation: modalIn 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(16px); }
    to   { opacity: 1; transform: scale(1)    translateY(0); }
}

.modal-conteudo::-webkit-scrollbar       { width: 4px; }
.modal-conteudo::-webkit-scrollbar-track { background: transparent; }
.modal-conteudo::-webkit-scrollbar-thumb { background: rgba(103,232,249,0.2); border-radius: 4px; }

/* gradiente no topo do modal */
.modal-conteudo::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--cyan) 30%, var(--gold) 70%, transparent);
    border-radius: 24px 24px 0 0;
    opacity: 0.5;
}

.fechar {
    position: absolute;
    right: 20px; top: 14px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: rgba(240,244,255,0.45);
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    transition: color 0.2s, background 0.2s;
    line-height: 1;
}

.fechar:hover {
    color: var(--white);
    background: rgba(255,255,255,0.09);
}

/* Layout interno do modal */
.modal-body {
    display: flex;
    gap: 32px;
    align-items: flex-start;
}

.modal-foto-col {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

#fotoCientista {
    width: 190px;
    height: 190px;
    object-fit: cover;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 0 30px rgba(103,232,249,0.15);
    display: block;
}

.modal-nome-area {
    text-align: center;
}

#nomeCientista {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 6px;
}

#areaCientista {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 11px;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.22);
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
}

.modal-divider {
    width: 1px;
    align-self: stretch;
    background: var(--border);
    flex-shrink: 0;
}

.modal-bio-col { flex: 1; min-width: 0; }

.modal-bio-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(240,244,255,0.30);
    margin-bottom: 14px;
}

#biografiaCientista {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.85;
    color: rgba(240,244,255,0.75);
    white-space: pre-line;
}

/* Destaques automáticos no texto */
#biografiaCientista strong {
    color: var(--white);
    font-weight: 500;
}

/* ── Mobile ── */
@media (max-width: 768px) {
    .btn-voltar-topo {
        position: static;
        transform: none;
        margin: 0 auto 18px;
        width: fit-content;
        display: flex;
    }

    .page-header { padding: 36px 20px 28px; }

    .modal-body { flex-direction: column; align-items: center; }

    .modal-divider { width: 100%; height: 1px; align-self: auto; }

    .modal-conteudo { padding: 28px 20px; }

    #fotoCientista { width: 150px; height: 150px; }

    .modal-bio-col { width: 100%; }

    .container { padding: 28px 0 48px; }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>

<body>

<canvas id="stars-canvas"></canvas>

<!-- Cabeçalho -->
<header class="page-header">
    <button class="btn-voltar-topo" id="btnVoltar">← Voltar</button>

    <div class="page-eyebrow">
        <span class="page-eyebrow-line"></span>
        <span>Mulheres Cientistas</span>
        <span class="page-eyebrow-line right"></span>
    </div>

    <h1 id="tituloPagina"></h1>
    <p class="page-desc">Clique em uma cientista para conhecer sua história</p>
</header>

<!-- Cards -->
<div class="container">
    <div id="listaCientistas" class="lista-cientistas"></div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-conteudo">

        <span id="fecharModal" class="fechar">✕</span>

        <div class="modal-body">

            <div class="modal-foto-col">
                <img id="fotoCientista">
                <div class="modal-nome-area">
                    <h2 id="nomeCientista"></h2>
                    <h3 id="areaCientista"></h3>
                </div>
            </div>

            <div class="modal-divider"></div>

            <div class="modal-bio-col">
                <p class="modal-bio-label">Biografia</p>
                <div id="biografiaCientista"></div>
            </div>

        </div>

    </div>
</div>

<!-- Estrelas -->
<script>
(function () {
    const canvas = document.getElementById('stars-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H, stars = [], nebulas = [], raf;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function createStars() {
        stars = Array.from({ length: 200 }, () => ({
            x:      Math.random() * W,
            y:      Math.random() * H,
            r:      Math.random() * 1.4 + 0.2,
            phase:  Math.random() * Math.PI * 2,
            speed:  Math.random() * 0.003 + 0.0008,
            drift:  (Math.random() - 0.5) * 0.06,
            bright: Math.random() * 0.5 + 0.3,
            glow:   false,
        }));
        for (let i = 0; i < 10; i++) {
            stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+1.2,
                phase: Math.random()*Math.PI*2, speed: Math.random()*0.002+0.0005,
                drift: (Math.random()-0.5)*0.04, bright: 0.75, glow: true });
        }
        nebulas = [
            { x:W*0.10, y:H*0.20, rx:200, ry:130, color:'rgba(103,50,200,0.07)'  },
            { x:W*0.75, y:H*0.55, rx:240, ry:170, color:'rgba(30,90,200,0.06)'   },
            { x:W*0.50, y:H*0.90, rx:280, ry:110, color:'rgba(103,232,249,0.04)' },
        ];
    }

    function draw(t) {
        ctx.clearRect(0, 0, W, H);
        nebulas.forEach(n => {
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, Math.max(n.rx,n.ry));
            g.addColorStop(0, n.color); g.addColorStop(1,'transparent');
            ctx.save(); ctx.scale(1, n.ry/n.rx);
            ctx.beginPath(); ctx.arc(n.x, n.y*(n.rx/n.ry), n.rx, 0, Math.PI*2);
            ctx.fillStyle = g; ctx.fill(); ctx.restore();
        });
        stars.forEach(s => {
            const a = s.bright * (0.4 + 0.6*Math.abs(Math.sin(s.phase + t*s.speed)));
            if (s.glow) {
                const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
                g.addColorStop(0, `rgba(200,235,255,${a*0.4})`); g.addColorStop(1,'transparent');
                ctx.beginPath(); ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fillStyle=`rgba(210,235,255,${a})`; ctx.fill();
            s.x += s.drift;
            if (s.x < -5) s.x = W+5;
            if (s.x > W+5) s.x = -5;
        });
        raf = requestAnimationFrame(draw);
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelAnimationFrame(raf);
        else raf = requestAnimationFrame(draw);
    });

    window.addEventListener('resize', () => { resize(); createStars(); });
    resize(); createStars();
    requestAnimationFrame(draw);
})();
</script>

const params = new URLSearchParams(window.location.search);
const pais   = params.get("pais");
const estado = params.get("estado");

// Botão voltar
window.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("btnVoltar");
    if (btn) {
        btn.addEventListener("click", () => {
            window.location.href = `/estados?pais=${encodeURIComponent(pais)}`;
        });
    }
});

// Título com formatação
document.getElementById("tituloPagina").innerHTML =
    `${pais} <em>•</em> ${estado}`;

const lista = document.getElementById("listaCientistas");

const cientistas = cientistasPorEstado?.[pais]?.[estado] || [];

cientistas.forEach(c => {
    const card = document.createElement("div");
    card.className = "card-cientista";
    card.innerHTML = `
        <div class="card-area-tag">✦ ${c.area}</div>
        <h2>${c.nome}</h2>
        <p>${c.area}</p>
        <div class="card-cta">
            <span>Ler mais</span>
            <span class="card-cta-arrow">→</span>
        </div>
    `;
    card.onclick = () => { abrirModal(c); };
    lista.appendChild(card);
});

function abrirModal(c) {
    document.getElementById("fotoCientista").src    = c.foto;
    document.getElementById("nomeCientista").innerText  = c.nome;
    document.getElementById("areaCientista").innerText  = c.area;
    document.getElementById("biografiaCientista").innerText = c.biografia;
    document.getElementById("modal").style.display = "flex";
}

document.getElementById("fecharModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

// Fechar clicando fora
document.getElementById("modal").onclick = function(e) {
    if (e.target === this) this.style.display = "none";
};

</script>
