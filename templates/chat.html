<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat com Cientistas</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan:    #67E8F9;
    --gold:    #F59E0B;
    --white:   #F0F4FF;
    --border:  rgba(103, 232, 249, 0.12);
    --glass:   rgba(8, 14, 35, 0.60);
    --msg-ia:  rgba(12, 22, 55, 0.80);
    --msg-usr: rgba(103, 232, 249, 0.18);
}

html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
}

body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(ellipse 120% 100% at 60% 110%,
                    #0d1b4b 0%, #080e28 40%, #04060f 100%);
    color: var(--white);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

#stars-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 55% 60% at 15% 40%, rgba(107,33,168,0.15) 0%, transparent 65%),
        radial-gradient(ellipse 40% 50% at 85% 70%, rgba(14,60,140,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
}

/* ── TOPO ── */
.topo {
    flex-shrink: 0;
    position: relative;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: rgba(4, 8, 22, 0.80);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    gap: 16px;
}

.topo h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--white);
    letter-spacing: 0.3px;
    flex: 1;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.topo h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--gold);
}

.topo h1 svg { flex-shrink: 0; }

.btn-voltar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: rgba(103,232,249,0.07);
    border: 1px solid rgba(103,232,249,0.20);
    border-radius: 10px;
    color: var(--cyan);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, transform 0.25s;
    white-space: nowrap;
}

.btn-voltar:hover {
    background: rgba(103,232,249,0.14);
    border-color: rgba(103,232,249,0.40);
    transform: translateY(-2px);
}

.btn-limpar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: rgba(239, 68, 68, 0.10);
    border: 1px solid rgba(239, 68, 68, 0.22);
    border-radius: 10px;
    color: #F87171;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, transform 0.25s;
    white-space: nowrap;
}

.btn-limpar:hover {
    background: rgba(239, 68, 68, 0.18);
    border-color: rgba(239, 68, 68, 0.40);
    transform: translateY(-2px);
}

/* ── SELEÇÃO DE CIENTISTA ── */
.selecao-cientista {
    flex-shrink: 0;
    position: relative;
    z-index: 40;
    display: flex;
    gap: 12px;
    padding: 14px 28px;
    overflow-x: auto;
    background: rgba(4, 8, 22, 0.50);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
}

.selecao-cientista::-webkit-scrollbar { display: none; }

.card-cientista {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, transform 0.25s;
    min-width: 0;
}

.card-cientista:hover {
    background: rgba(103,232,249,0.08);
    border-color: rgba(103,232,249,0.25);
    transform: translateY(-2px);
}

.card-cientista.ativo {
    background: rgba(103,232,249,0.12);
    border-color: rgba(103,232,249,0.45);
    box-shadow: 0 0 0 1px rgba(103,232,249,0.15);
}

.card-cientista img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid transparent;
    transition: border-color 0.25s;
    flex-shrink: 0;
}

.card-cientista.ativo img {
    border-color: var(--cyan);
}

.card-info h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--white);
    white-space: nowrap;
}

.card-info p {
    font-size: 11px;
    font-weight: 300;
    color: rgba(240,244,255,0.45);
    white-space: nowrap;
}

/* ── INFO DA CIENTISTA ── */
.info-cientista {
    flex-shrink: 0;
    position: relative;
    z-index: 40;
    display: none;
    align-items: center;
    gap: 20px;
    padding: 16px 28px;
    background: rgba(8,14,38,0.70);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    animation: fadeUp 0.4s ease both;
}

.info-cientista img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(103,232,249,0.30);
    flex-shrink: 0;
}

.info-cientista-texto h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--white);
    margin-bottom: 2px;
}

.info-cientista-texto p {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
}

.descricao-cientista {
    font-size: 12px;
    font-weight: 300;
    color: rgba(240,244,255,0.50);
    line-height: 1.55;
    max-width: 700px;
}

/* ── CHAT ── */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: rgba(103,232,249,0.15) transparent;
}

.chat::-webkit-scrollbar       { width: 4px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: rgba(103,232,249,0.15); border-radius: 4px; }

/* ── MENSAGENS ── */
.bloco-mensagem {
    display: flex;
    flex-direction: column;
    max-width: 72%;
    gap: 5px;
    animation: msgIn 0.3s ease both;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

.bloco-mensagem.usuario { align-self: flex-end; align-items: flex-end; }
.bloco-mensagem.ia      { align-self: flex-start; align-items: flex-start; }

.nome-remetente {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 0 6px;
}

.usuario .nome-remetente { color: rgba(103,232,249,0.60); }
.ia      .nome-remetente { color: rgba(245,158,11,0.70); }

.mensagem {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 14px;
    font-weight: 300;
    word-break: break-word;
}

.usuario .mensagem {
    background: var(--msg-usr);
    border: 1px solid rgba(103,232,249,0.20);
    border-bottom-right-radius: 4px;
    color: var(--white);
}

.ia .mensagem {
    background: var(--msg-ia);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: rgba(240,244,255,0.88);
}

.loading {
    font-style: italic;
    color: rgba(240,244,255,0.45) !important;
}

/* ── CONTROLES DE ÁUDIO ── */
.controles-audio {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: 6px;
    margin-top: 2px;
}

.btn-audio {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: rgba(240,244,255,0.55);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}

.btn-audio:hover {
    background: rgba(103,232,249,0.08);
    border-color: rgba(103,232,249,0.25);
    color: var(--cyan);
}

/* ── ÁREA DE ENVIO ── */
.area-envio {
    flex-shrink: 0;
    position: relative;
    z-index: 40;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 28px;
    background: rgba(4, 8, 22, 0.80);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
}

.input-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
}

#mensagemInput {
    width: 100%;
    padding: 12px 16px;
    background: rgba(103,232,249,0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--white);
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    resize: none;
}

#mensagemInput::placeholder { color: rgba(240,244,255,0.28); }

#mensagemInput:focus {
    border-color: rgba(103,232,249,0.40);
    background: rgba(103,232,249,0.08);
    box-shadow: 0 0 0 3px rgba(103,232,249,0.07);
}

.status-voz {
    font-size: 11px;
    font-weight: 300;
    color: rgba(240,244,255,0.38);
    min-height: 16px;
    padding-left: 4px;
}

/* Botões de ação */
.btn-enviar,
.btn-microfone,
.btn-confirmar {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.22s, box-shadow 0.22s, filter 0.22s;
}

.btn-microfone {
    background: rgba(251,146,60,0.15);
    border: 1px solid rgba(251,146,60,0.28);
    color: #FB923C;
    font-size: 17px;
}

.btn-microfone:hover {
    background: rgba(251,146,60,0.25);
    transform: translateY(-2px);
}

.btn-confirmar {
    background: rgba(74,222,128,0.12);
    border: 1px solid rgba(74,222,128,0.25);
    color: #4ADE80;
    font-size: 16px;
}

.btn-confirmar:hover {
    background: rgba(74,222,128,0.22);
    transform: translateY(-2px);
}

.btn-enviar {
    background: rgba(103,232,249,0.14);
    border: 1px solid rgba(103,232,249,0.30);
    color: var(--cyan);
    font-size: 16px;
}

.btn-enviar:hover {
    background: rgba(103,232,249,0.24);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(103,232,249,0.18);
}

/* ── Animações ── */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── Mobile ── */
@media (max-width: 768px) {
    .topo       { padding: 12px 16px; }
    .topo h1    { font-size: 18px; }
    .selecao-cientista { padding: 12px 16px; }
    .info-cientista    { padding: 14px 16px; flex-wrap: wrap; }
    .chat       { padding: 16px; }
    .area-envio { padding: 12px 16px; }
    .bloco-mensagem { max-width: 88%; }
}

@media (max-width: 480px) {
    .topo h1 span { display: none; } /* esconde label texto, mantém ícone */
    .btn-voltar span,
    .btn-limpar span { display: none; }
    .btn-voltar, .btn-limpar { padding: 8px 10px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>

<body>

<canvas id="stars-canvas"></canvas>

<!-- TOPO -->
<div class="topo">

    <button class="btn-voltar" id="btnVoltarMenu">
        ← <span>Voltar</span>
    </button>

    <h1>
        <svg width="20" height="20" viewBox="0 0 52 52" fill="none">
            <path d="M6 10 Q6 6 10 6 L42 6 Q46 6 46 10 L46 32 Q46 36 42 36 L18 36 L8 46 L8 36 L10 36 Q6 36 6 32 Z"
                  stroke="#67E8F9" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <circle cx="18" cy="21" r="2.5" fill="#F59E0B" opacity="0.9"/>
            <circle cx="26" cy="21" r="2.5" fill="#F59E0B" opacity="0.65"/>
            <circle cx="34" cy="21" r="2.5" fill="#F59E0B" opacity="0.40"/>
        </svg>
        <span>Chat com </span><em>Cientistas</em>
    </h1>

    <button class="btn-limpar" onclick="novaConversa()">
        ✕ <span>Nova Conversa</span>
    </button>

</div>

<!-- SELEÇÃO DE CIENTISTA -->
<div class="selecao-cientista">

    <div class="card-cientista" data-nome="Marie Curie"
         onclick="selecionarCientista('Marie Curie', this)">
        <img src="/static/imagens/cientistas/marie.jpg" alt="Marie Curie">
        <div class="card-info">
            <h3>Marie Curie</h3>
            <p>Física e Química</p>
        </div>
    </div>

    <div class="card-cientista" data-nome="Ada Lovelace"
         onclick="selecionarCientista('Ada Lovelace', this)">
        <img src="/static/imagens/cientistas/ada.jpg" alt="Ada Lovelace">
        <div class="card-info">
            <h3>Ada Lovelace</h3>
            <p>Matemática e Computação</p>
        </div>
    </div>

    <div class="card-cientista" data-nome="Rosalind Franklin"
         onclick="selecionarCientista('Rosalind Franklin', this)">
        <img src="/static/imagens/cientistas/rosalind.jpg" alt="Rosalind Franklin">
        <div class="card-info">
            <h3>Rosalind Franklin</h3>
            <p>Biologia Molecular</p>
        </div>
    </div>

    <div class="card-cientista" data-nome="Mayana Zatz"
         onclick="selecionarCientista('Mayana Zatz', this)">
        <img src="/static/imagens/cientistas/mayana.jpg" alt="Mayana Zatz">
        <div class="card-info">
            <h3>Mayana Zatz</h3>
            <p>Genética</p>
        </div>
    </div>

</div>

<!-- INFO DA CIENTISTA -->
<div id="infoCientista" class="info-cientista">
    <img id="fotoCientista" alt="Foto da cientista">
    <div class="info-cientista-texto">
        <h2 id="nomeCientista"></h2>
        <p id="areaCientista"></p>
        <div id="descricaoCientista" class="descricao-cientista"></div>
    </div>
</div>

<!-- CHAT -->
<div id="chat" class="chat"></div>

<!-- ÁREA DE ENVIO -->
<div class="area-envio">

    <div class="input-wrapper">
        <input
            type="text"
            id="mensagemInput"
            placeholder="Digite sua pergunta…">
        <div id="statusVoz" class="status-voz"></div>
    </div>

    <button class="btn-microfone" onclick="iniciarMicrofone()" title="Usar microfone">🎤</button>
    <button class="btn-confirmar" onclick="enviarMensagem()" title="Confirmar">✔</button>
    <button class="btn-enviar"   onclick="enviarMensagem()" title="Enviar">➤</button>

</div>

<!-- Estrelas -->
<script>
(function () {
    const canvas = document.getElementById('stars-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H, stars = [], nebulas = [], raf;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function createStars() {
        stars = Array.from({ length: 160 }, () => ({
            x: Math.random()*W, y: Math.random()*H,
            r: Math.random()*1.3+0.2,
            phase: Math.random()*Math.PI*2,
            speed: Math.random()*0.003+0.0008,
            drift: (Math.random()-0.5)*0.05,
            bright: Math.random()*0.45+0.25, glow: false,
        }));
        for (let i = 0; i < 8; i++) {
            stars.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+1,
                phase:Math.random()*Math.PI*2, speed:Math.random()*0.002+0.0004,
                drift:(Math.random()-0.5)*0.03, bright:0.70, glow:true });
        }
        nebulas = [
            { x:W*0.10, y:H*0.20, rx:180, ry:120, color:'rgba(103,50,200,0.06)'  },
            { x:W*0.80, y:H*0.65, rx:220, ry:150, color:'rgba(30,90,200,0.05)'   },
        ];
    }

    function draw(t) {
        ctx.clearRect(0, 0, W, H);
        nebulas.forEach(n => {
            const g = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,Math.max(n.rx,n.ry));
            g.addColorStop(0,n.color); g.addColorStop(1,'transparent');
            ctx.save(); ctx.scale(1,n.ry/n.rx);
            ctx.beginPath(); ctx.arc(n.x,n.y*(n.rx/n.ry),n.rx,0,Math.PI*2);
            ctx.fillStyle=g; ctx.fill(); ctx.restore();
        });
        stars.forEach(s => {
            const a = s.bright*(0.35+0.65*Math.abs(Math.sin(s.phase+t*s.speed)));
            if (s.glow) {
                const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
                g.addColorStop(0,`rgba(200,235,255,${a*0.35})`); g.addColorStop(1,'transparent');
                ctx.beginPath(); ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fillStyle=`rgba(210,235,255,${a})`; ctx.fill();
            s.x+=s.drift;
            if(s.x<-5)s.x=W+5; if(s.x>W+5)s.x=-5;
        });
        raf = requestAnimationFrame(draw);
    }

    document.addEventListener('visibilitychange',()=>{
        if(document.hidden)cancelAnimationFrame(raf);
        else raf=requestAnimationFrame(draw);
    });
    window.addEventListener('resize',()=>{resize();createStars();});
    resize(); createStars();
    requestAnimationFrame(draw);
})();
</script>

<script>

let cientistaAtual = null;
let historicoChat = [];
let reconhecimento = null;
let utteranceAtual = null;

const cientistas = {

    "Marie Curie": {
        nome: "Marie Curie",
        area: "Física e Química",
        foto: "/static/imagens/cientistas/marie.jpg",
        descricao: "Marie Curie foi uma cientista pioneira nas pesquisas sobre radioatividade, vencedora de dois Prêmios Nobel.",
        saudacao: "Olá! Sou Marie Curie. Posso conversar sobre radioatividade, física, química e minha trajetória científica."
    },

    "Ada Lovelace": {
        nome: "Ada Lovelace",
        area: "Matemática e Computação",
        foto: "/static/imagens/cientistas/ada.jpg",
        descricao: "Ada Lovelace é considerada uma das pioneiras da computação por ter criado o primeiro algoritmo destinado a uma máquina.",
        saudacao: "Olá! Sou Ada Lovelace. Posso conversar sobre matemática, algoritmos, lógica e o início da computação."
    },

    "Rosalind Franklin": {
        nome: "Rosalind Franklin",
        area: "Biologia Molecular",
        foto: "/static/imagens/cientistas/rosalind.jpg",
        descricao: "Rosalind Franklin foi essencial para os estudos da estrutura do DNA e também pesquisou vírus, carvão e grafite.",
        saudacao: "Olá! Sou Rosalind Franklin. Posso conversar sobre DNA, biologia molecular, pesquisa científica e minhas descobertas."
    },

    "Mayana Zatz": {
        nome: "Mayana Zatz",
        area: "Genética",
        foto: "/static/imagens/cientistas/mayana.jpg",
        descricao: "Mayana Zatz é uma cientista brasileira de destaque na genética, com pesquisas importantes sobre doenças neuromusculares.",
        saudacao: "Olá! Sou Mayana Zatz. Posso conversar sobre genética, ciência no Brasil, pesquisas médicas e doenças genéticas."
    }
};

function selecionarCientista(nome, cardSelecionado){

    desbloquearAudioSeNecessario(); // clique do usuário = momento certo para desbloquear

    cientistaAtual = cientistas[nome];
    historicoChat = [];

    document.querySelectorAll(".card-cientista").forEach(card => {
        card.classList.remove("ativo");
    });

    if(cardSelecionado){
        cardSelecionado.classList.add("ativo");
    }

    document.getElementById("infoCientista").style.display = "flex";
    document.getElementById("fotoCientista").src = cientistaAtual.foto;
    document.getElementById("nomeCientista").innerText = cientistaAtual.nome;
    document.getElementById("areaCientista").innerText = cientistaAtual.area;
    document.getElementById("descricaoCientista").innerText = cientistaAtual.descricao;

    document.getElementById("chat").innerHTML = "";

    adicionarMensagemIA(cientistaAtual.saudacao);

    historicoChat.push({
        autor: cientistaAtual.nome,
        texto: cientistaAtual.saudacao
    });
}

function adicionarMensagemUsuario(texto){

    const chat = document.getElementById("chat");

    const bloco = document.createElement("div");
    bloco.className = "bloco-mensagem usuario";

    const nome = document.createElement("div");
    nome.className = "nome-remetente";
    nome.innerText = "Você";

    const msg = document.createElement("div");
    msg.className = "mensagem";
    msg.innerText = texto;

    bloco.appendChild(nome);
    bloco.appendChild(msg);
    chat.appendChild(bloco);

    rolarChat();
}

function limparMarkdown(texto) {
    return texto
        // Remove **negrito** e __negrito__
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/__(.*?)__/g, '$1')
        // Remove *itálico* e _itálico_
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/_(.*?)_/g, '$1')
        // Remove # títulos
        .replace(/^#{1,6}\s+/gm, '')
        // Remove marcadores de lista: "1. " "- " "* "
        .replace(/^\s*\d+\.\s+/gm, '• ')
        .replace(/^\s*[-*]\s+/gm, '• ')
        // Remove ~~tachado~~
        .replace(/~~(.*?)~~/g, '$1')
        // Remove `código`
        .replace(/`(.*?)`/g, '$1')
        // Remove linhas horizontais ---
        .replace(/^[-*_]{3,}$/gm, '')
        // Remove espaços extras no início/fim
        .trim();
}

function adicionarMensagemIA(texto){

    texto = limparMarkdown(texto); // remove símbolos Markdown

    const chat = document.getElementById("chat");

    const bloco = document.createElement("div");
    bloco.className = "bloco-mensagem ia";

    const nome = document.createElement("div");
    nome.className = "nome-remetente";
    nome.innerText = cientistaAtual ? cientistaAtual.nome : "Cientista";

    const msg = document.createElement("div");
    msg.className = "mensagem";
    msg.innerText = texto;

    bloco.appendChild(nome);
    bloco.appendChild(msg);

    const controles = document.createElement("div");
    controles.className = "controles-audio";

    const btnOuvir = document.createElement("button");
    btnOuvir.className = "btn-audio";
    btnOuvir.innerText = "🔊 Ouvir novamente";
    btnOuvir.onclick = () => {
        desbloquearAudioSeNecessario();
        filaDeFala = []; // limpa fila anterior
        falar(texto);
    };

    const btnPausar = document.createElement("button");
    btnPausar.className = "btn-audio";
    btnPausar.innerText = "⏸ Pausar";
    btnPausar.onclick = () => pausarFala();

    const btnContinuar = document.createElement("button");
    btnContinuar.className = "btn-audio";
    btnContinuar.innerText = "▶ Continuar";
    btnContinuar.onclick = () => continuarFala();

    controles.appendChild(btnOuvir);
    controles.appendChild(btnPausar);
    controles.appendChild(btnContinuar);

    bloco.appendChild(controles);

    chat.appendChild(bloco);

    falar(texto);
    rolarChat();
}

function adicionarMensagemCarregando(){

    const chat = document.getElementById("chat");

    const bloco = document.createElement("div");
    bloco.className = "bloco-mensagem ia";
    bloco.id = "mensagemLoading";

    const nome = document.createElement("div");
    nome.className = "nome-remetente";
    nome.innerText = cientistaAtual ? cientistaAtual.nome : "Cientista";

    const msg = document.createElement("div");
    msg.className = "mensagem loading";
    msg.innerText = "Pensando na resposta...";

    bloco.appendChild(nome);
    bloco.appendChild(msg);
    chat.appendChild(bloco);

    rolarChat();
}

function removerMensagemCarregando(){
    const loading = document.getElementById("mensagemLoading");
    if(loading){ loading.remove(); }
}

async function enviarMensagem(){

    if(!cientistaAtual){
        alert("Escolha uma cientista primeiro.");
        return;
    }

    const input = document.getElementById("mensagemInput");
    const texto = input.value.trim();

    if(texto === ""){ return; }

    adicionarMensagemUsuario(texto);

    historicoChat.push({ autor: "Usuário", texto: texto });

    input.value = "";
    document.getElementById("statusVoz").innerText = "";

    adicionarMensagemCarregando();

    try{

        const resposta = await fetch("/api/chat_cientista", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mensagem: texto,
                cientista: cientistaAtual.nome,
                historico: historicoChat
            })
        });

        const dados = await resposta.json();

        removerMensagemCarregando();

        if(dados.erro){
            adicionarMensagemIA("Desculpe, ocorreu um erro: " + dados.erro);
            return;
        }

        adicionarMensagemIA(dados.resposta);

        historicoChat.push({ autor: cientistaAtual.nome, texto: dados.resposta });

    }catch(erro){
        console.error(erro);
        removerMensagemCarregando();
        adicionarMensagemIA("Desculpe, ocorreu um erro ao conversar com a IA.");
    }
}

// ── VOZ: sistema robusto com desbloqueio e fila ──

let vozesCarregadas = false;
let audioDesbloqueado = false;
let filaDeFala = [];
let processandoFila = false;

// Perfil de voz de cada cientista:
// pitch mais alto = mais feminino | rate ideal = 1.1~1.2 (natural, não lenta)
const perfisVoz = {
    "Marie Curie":       { pitch: 1.25, rate: 1.15 }, // voz mais suave e serena
    "Ada Lovelace":      { pitch: 1.20, rate: 1.20 }, // voz mais animada e jovem
    "Rosalind Franklin": { pitch: 1.15, rate: 1.10 }, // voz mais firme e sábia
    "Mayana Zatz":       { pitch: 1.30, rate: 1.15 }, // voz mais calorosa e brasileira
};

// Prioridade de vozes femininas em pt-BR — do mais natural ao fallback
const PRIORIDADE_VOZES = [
    // Chrome no Windows/Mac — as melhores
    "Google português do Brasil",
    "Microsoft Francisca Online",   // Edge/Windows 11 — excelente
    "Microsoft Maria",              // Edge/Windows — boa
    "Microsoft Maria Online (Natural)",
    "Francisca",
    "Maria",
    // macOS / iOS
    "Luciana",
    // fallback genérico pt
    "pt-BR",
];

let vozFeminina = null; // melhor voz feminina encontrada

function carregarVozes() {
    if (!("speechSynthesis" in window)) return;
    const vozes = speechSynthesis.getVoices();
    if (vozes.length === 0) return;
    vozesCarregadas = true;

    // Tenta cada nome da lista de prioridade
    for (const alvo of PRIORIDADE_VOZES) {
        const encontrada = vozes.find(v =>
            v.name.toLowerCase().includes(alvo.toLowerCase()) ||
            v.lang === alvo
        );
        if (encontrada) {
            vozFeminina = encontrada;
            console.log("✅ Voz selecionada:", encontrada.name, encontrada.lang);
            break;
        }
    }

    // Fallback: qualquer voz em pt
    if (!vozFeminina) {
        vozFeminina =
            vozes.find(v => v.lang === "pt-BR") ||
            vozes.find(v => v.lang && v.lang.toLowerCase().startsWith("pt")) ||
            null;
    }

    if (vozFeminina) {
        console.log("🎤 Voz final:", vozFeminina.name);
    } else {
        console.warn("⚠ Nenhuma voz pt-BR encontrada. Vozes disponíveis:", vozes.map(v => v.name));
    }
}

function desbloquearAudioSeNecessario() {
    if (!("speechSynthesis" in window) || audioDesbloqueado) return;
    carregarVozes();
    try {
        const silencio = new SpeechSynthesisUtterance(" ");
        silencio.volume = 0;
        silencio.rate = 10;
        silencio.lang = "pt-BR";
        if (vozFeminina) silencio.voice = vozFeminina;
        speechSynthesis.cancel();
        speechSynthesis.speak(silencio);
        audioDesbloqueado = true;
    } catch(e) { console.warn("Desbloqueio de áudio falhou:", e); }
}

function falar(texto) {
    if (!("speechSynthesis" in window) || !texto || !texto.trim()) return;
    carregarVozes();
    filaDeFala.push(texto);
    if (!processandoFila) processarFila();
}

function processarFila() {
    if (filaDeFala.length === 0) { processandoFila = false; return; }
    processandoFila = true;

    const texto = filaDeFala.shift();
    speechSynthesis.cancel();

    setTimeout(() => {
        // Pega o perfil da cientista atual (ou padrão feminino)
        const perfil = cientistaAtual
            ? (perfisVoz[cientistaAtual.nome] || { pitch: 1.20, rate: 1.15 })
            : { pitch: 1.20, rate: 1.15 };

        utteranceAtual = new SpeechSynthesisUtterance(texto);
        utteranceAtual.lang   = "pt-BR";
        utteranceAtual.pitch  = perfil.pitch; // > 1 = mais agudo = mais feminino
        utteranceAtual.rate   = perfil.rate;  // > 1 = mais rápido = menos robótico
        utteranceAtual.volume = 1;
        if (vozFeminina) utteranceAtual.voice = vozFeminina;

        const statusEl = document.getElementById("statusVoz");

        utteranceAtual.onstart = () => {
            if (statusEl) statusEl.innerText = "🔊 Cientista falando…";
        };

        // Workaround Chrome/Android que trava após ~14s
        const keepAlive = setInterval(() => {
            if (!speechSynthesis.speaking) { clearInterval(keepAlive); return; }
            speechSynthesis.pause();
            speechSynthesis.resume();
        }, 10000);

        utteranceAtual.onend = () => {
            clearInterval(keepAlive);
            if (statusEl) statusEl.innerText = "";
            processarFila();
        };

        utteranceAtual.onerror = (e) => {
            clearInterval(keepAlive);
            if (e.error !== "interrupted") {
                console.warn("Erro de voz:", e.error);
                if (statusEl) statusEl.innerText = "⚠ Erro ao reproduzir voz.";
            }
            processandoFila = false;
        };

        speechSynthesis.speak(utteranceAtual);
    }, 120);
}

function pausarFala() {
    if ("speechSynthesis" in window && speechSynthesis.speaking && !speechSynthesis.paused) {
        speechSynthesis.pause();
        const s = document.getElementById("statusVoz");
        if (s) s.innerText = "⏸ Pausado.";
    }
}

function continuarFala() {
    if ("speechSynthesis" in window && speechSynthesis.paused) {
        speechSynthesis.resume();
        const s = document.getElementById("statusVoz");
        if (s) s.innerText = "▶ Retomado.";
    }
}

function rolarChat(){
    const chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
}

function novaConversa(){
    document.getElementById("chat").innerHTML = "";
    historicoChat = [];
    speechSynthesis.cancel();

    if(cientistaAtual){
        adicionarMensagemIA(cientistaAtual.saudacao);
        historicoChat.push({ autor: cientistaAtual.nome, texto: cientistaAtual.saudacao });
    }
}

function iniciarMicrofone(){

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Seu navegador não suporta reconhecimento de voz.");
        return;
    }

    reconhecimento = new SpeechRecognition();
    reconhecimento.lang = "pt-BR";
    reconhecimento.interimResults = false;
    reconhecimento.maxAlternatives = 1;

    const status = document.getElementById("statusVoz");
    status.innerText = "🎙️ Ouvindo… fale agora.";

    reconhecimento.start();

    reconhecimento.onresult = function(event){
        const texto = event.results[0][0].transcript;
        const input = document.getElementById("mensagemInput");
        input.value = texto;
        input.focus();
        status.innerText = "✔ Fala convertida. Você pode editar antes de enviar.";
    };

    reconhecimento.onerror = function(event){
        console.error("Erro no microfone:", event.error);
        status.innerText = "Erro ao captar áudio.";
        alert("Não foi possível captar sua fala. Tente novamente.");
    };

    reconhecimento.onend = function(){
        if(status.innerText === "🎙️ Ouvindo… fale agora."){
            status.innerText = "Microfone finalizado.";
        }
    };
}

document.getElementById("mensagemInput").addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        event.preventDefault();
        enviarMensagem();
    }
});

const chatParams = new URLSearchParams(window.location.search);
const chatPais = chatParams.get("pais");

document.getElementById("btnVoltarMenu").addEventListener("click", () => {
    if (chatPais) {
        window.location.href = `/menu?pais=${encodeURIComponent(chatPais)}`;
    } else {
        window.location.href = "/menu";
    }
});

// ── Inicialização de voz ──

// Carrega vozes imediatamente (Chrome já tem, Safari carrega depois)
if ("speechSynthesis" in window) {
    carregarVozes();
    speechSynthesis.onvoiceschanged = carregarVozes;
}

// Desbloqueio de áudio no PRIMEIRO toque/clique do usuário (obrigatório em Safari/iOS)
function aoUsuarioInteragir() {
    desbloquearAudioSeNecessario();
}

// Botões que o usuário provavelmente vai clicar primeiro
document.querySelectorAll(".card-cientista").forEach(card => {
    card.addEventListener("click", aoUsuarioInteragir);
});

document.getElementById("mensagemInput").addEventListener("focus", aoUsuarioInteragir);
document.querySelector(".btn-enviar").addEventListener("click", aoUsuarioInteragir);
document.querySelector(".btn-confirmar").addEventListener("click", aoUsuarioInteragir);
document.querySelector(".btn-microfone").addEventListener("click", aoUsuarioInteragir);

// Fallback: qualquer primeiro toque na página
document.addEventListener("pointerdown", aoUsuarioInteragir, { once: true });

</script>
