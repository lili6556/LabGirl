<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Estados</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan:   #67E8F9;
    --gold:   #F59E0B;
    --white:  #F0F4FF;
    --glass:  rgba(8, 14, 35, 0.60);
    --border: rgba(103, 232, 249, 0.12);
    --hover:  rgba(103, 232, 249, 0.10);
}

html, body {
    width: 100%;
    height: 100dvh;
}

body {
    /* Fundo espacial igual ao mapa */
    background: radial-gradient(ellipse 120% 100% at 60% 110%,
                    #0d1b4b 0%,
                    #080e28 40%,
                    #04060f 100%);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    display: flex;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* Canvas de estrelas */
#stars-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

/* Névoa */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 55% 60% at 20% 50%, rgba(107,33,168,0.20) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 80% 30%, rgba(14,60,140,0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
}

/* ── Lado esquerdo: painel do país ── */
.esquerda {
    width: 38%;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px;
    animation: fadeLeft 0.7s cubic-bezier(0.25,0.46,0.45,0.94) both;
}

@keyframes fadeLeft {
    from { opacity: 0; transform: translateX(-24px); }
    to   { opacity: 1; transform: translateX(0); }
}

.painel-pais {
    width: 100%;
    height: 92vh;
    max-height: 950px;
    position: relative;
    border-radius: 24px;
    overflow: hidden;

    background: rgba(8,14,35,0.50);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border: 1px solid var(--border);
    box-shadow:
        0 0 40px rgba(103,232,249,0.10),
        inset 0 0 30px rgba(255,255,255,0.03);
}

/* Brilho ciano na borda do painel do país */
.painel-pais::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    border: 1px solid transparent;
    background:
        linear-gradient(135deg, rgba(103,232,249,0.25), transparent 50%, rgba(245,158,11,0.15)) border-box;
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
}

.fundo-pais {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 24px;
    transition: transform 0.6s ease;
}

.painel-pais:hover .fundo-pais {
    transform: scale(1.03);
}

/* ── Lado direito: lista ── */
.direita {
    width: 55%;
    position: relative;
    z-index: 2;
    padding: 36px 32px;

    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border-left: 1px solid var(--border);

    display: flex;
    flex-direction: column;
    overflow: hidden;

    animation: slideIn 0.7s cubic-bezier(0.25,0.46,0.45,0.94) both;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(24px); }
    to   { opacity: 1; transform: translateX(0); }
}

/* gradiente na borda esquerda */
.direita::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 100%;
    background: linear-gradient(
        to bottom,
        transparent,
        var(--cyan) 30%,
        var(--gold) 70%,
        transparent
    );
    opacity: 0.35;
    pointer-events: none;
}

/* ── Cabeçalho ── */
.cabecalho {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 24px;
    flex-shrink: 0;
}

.cabecalho-eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}

.cabecalho-eyebrow span {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cyan);
    opacity: 0.75;
}

.cabecalho-eyebrow-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--cyan), transparent);
    opacity: 0.35;
    max-width: 60px;
}

.cabecalho h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.15;
    color: var(--white);
    letter-spacing: 0.3px;
}

.cabecalho h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--gold);
}

.cabecalho-btns {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    align-items: center;
}

.btn-voltar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 16px;

    background: rgba(103,232,249,0.08);
    border: 1px solid rgba(103,232,249,0.22);
    border-radius: 10px;

    color: var(--cyan);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;

    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, transform 0.25s;
    white-space: nowrap;
}

.btn-voltar:hover {
    background: rgba(103,232,249,0.15);
    border-color: rgba(103,232,249,0.45);
    transform: translateY(-2px);
}

.btn-ciencia {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;

    background: linear-gradient(135deg, #F59E0B, #d4850a);
    border: none;
    border-radius: 10px;

    color: #04060f;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;

    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    box-shadow: 0 4px 16px rgba(245,158,11,0.30);
    white-space: nowrap;
}

.btn-ciencia:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(245,158,11,0.50);
}

.btn-ciencia:active {
    transform: scale(0.97);
}

/* ── Campo de pesquisa ── */
.pesquisa-wrapper {
    position: relative;
    margin-bottom: 16px;
    flex-shrink: 0;
}

.pesquisa-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--cyan);
    opacity: 0.50;
    font-size: 15px;
    pointer-events: none;
}

.pesquisa {
    width: 100%;
    padding: 11px 14px 11px 38px;

    background: rgba(103,232,249,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;

    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--white);

    outline: none;
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
}

.pesquisa::placeholder { color: rgba(240,244,255,0.28); }

.pesquisa:focus {
    border-color: rgba(103,232,249,0.45);
    background: rgba(103,232,249,0.09);
    box-shadow: 0 0 0 3px rgba(103,232,249,0.07);
}

/* ── Lista de estados ── */
.lista-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(240,244,255,0.28);
    margin-bottom: 10px;
    flex-shrink: 0;
}

.lista-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(103,232,249,0.2) transparent;
}

.lista-scroll::-webkit-scrollbar       { width: 4px; }
.lista-scroll::-webkit-scrollbar-track { background: transparent; }
.lista-scroll::-webkit-scrollbar-thumb { background: rgba(103,232,249,0.2); border-radius: 4px; }

.listaEstados {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
}

.estado {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;

    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;

    cursor: pointer;
    transition: background 0.22s, border-color 0.22s, transform 0.22s;
    animation: fadeItem 0.35s ease both;
}

.estado:nth-child(1) { animation-delay: 0.04s; }
.estado:nth-child(2) { animation-delay: 0.08s; }
.estado:nth-child(3) { animation-delay: 0.12s; }
.estado:nth-child(4) { animation-delay: 0.16s; }
.estado:nth-child(5) { animation-delay: 0.20s; }
.estado:nth-child(6) { animation-delay: 0.24s; }

@keyframes fadeItem {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: translateX(0); }
}

.estado-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    opacity: 0.45;
    transition: opacity 0.22s, transform 0.22s;
}

.estado-nome {
    font-size: 14px;
    font-weight: 400;
    color: rgba(240,244,255,0.80);
    transition: color 0.22s;
}

.estado:hover {
    background: var(--hover);
    border-color: rgba(103,232,249,0.25);
    transform: translateX(5px);
}

.estado:hover .estado-dot  { opacity: 1; transform: scale(1.3); background: var(--cyan); }
.estado:hover .estado-nome { color: var(--white); }

/* ── Mobile ── */
@media (max-width: 900px) {
    body { flex-direction: column; overflow-y: auto; }

    .esquerda {
        width: 100%;
        height: 38dvh;
        padding: 20px;
        animation: none;
    }

    .direita {
        width: 100%;
        height: auto;
        min-height: 62dvh;
        border-left: none;
        border-top: 1px solid var(--border);
        padding: 22px 20px;
        overflow-y: auto;
        animation: none;
    }

    .direita::before {
        width: 100%; height: 1px;
        background: linear-gradient(to right, transparent, var(--cyan) 40%, var(--gold) 60%, transparent);
    }

    .cabecalho { flex-wrap: wrap; }

    .cabecalho h1 { font-size: 22px; }

    .cabecalho-btns { width: 100%; justify-content: flex-start; }
}

@media (max-width: 480px) {
    .cabecalho h1    { font-size: 18px; }
    .btn-voltar,
    .btn-ciencia     { font-size: 12px; padding: 9px 12px; }
    .estado-nome     { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

</style>

</head>

<body>

<canvas id="stars-canvas"></canvas>

<div class="esquerda">
    <div class="painel-pais">
        <img id="fundoPais" class="fundo-pais">
    </div>
</div>

<div class="direita">

    <div class="cabecalho">
        <div class="cabecalho-texto">
            <div class="cabecalho-eyebrow">
                <span>Mulheres Cientistas</span>
                <span class="cabecalho-eyebrow-line"></span>
            </div>
            <h1>Escolha um <em>Estado</em></h1>
        </div>

        <div class="cabecalho-btns">
            <button class="btn-voltar" onclick="window.location.href='/mapa'">
                🌎 Voltar ao Globo
            </button>
            <button class="btn-ciencia" onclick="irParaMenu()">
    🔬 Página da Ciência
</button>
        </div>
    </div>

    <div class="pesquisa-wrapper">
        <span class="pesquisa-icon">⌕</span>
        <input
            type="text"
            id="pesquisa"
            class="pesquisa"
            placeholder="Pesquisar estado…"
            autocomplete="off">
    </div>

    <p class="lista-label">Estados disponíveis</p>

    <div class="lista-scroll">
        <div id="listaEstados" class="listaEstados"></div>
    </div>

</div>

<!-- Estrelas -->
<script>
(function () {
    const canvas = document.getElementById('stars-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H, stars = [], nebulas = [], raf;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function createStars() {
        stars = Array.from({ length: 200 }, () => ({
            x:      Math.random() * W,
            y:      Math.random() * H,
            r:      Math.random() * 1.4 + 0.2,
            phase:  Math.random() * Math.PI * 2,
            speed:  Math.random() * 0.003 + 0.0008,
            drift:  (Math.random() - 0.5) * 0.06,
            bright: Math.random() * 0.5 + 0.3,
            glow:   false,
        }));
        for (let i = 0; i < 10; i++) {
            stars.push({
                x: Math.random() * W, y: Math.random() * H,
                r: Math.random() * 2 + 1.2,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.002 + 0.0005,
                drift: (Math.random() - 0.5) * 0.04,
                bright: 0.75, glow: true,
            });
        }
        nebulas = [
            { x: W*0.15, y: H*0.3,  rx:180, ry:120, color:'rgba(103,50,200,0.07)'  },
            { x: W*0.70, y: H*0.65, rx:220, ry:160, color:'rgba(30,90,200,0.06)'   },
            { x: W*0.45, y: H*0.85, rx:260, ry:100, color:'rgba(103,232,249,0.04)' },
        ];
    }

    function draw(t) {
        ctx.clearRect(0, 0, W, H);
        nebulas.forEach(n => {
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, Math.max(n.rx, n.ry));
            g.addColorStop(0, n.color); g.addColorStop(1, 'transparent');
            ctx.save();
            ctx.scale(1, n.ry / n.rx);
            ctx.beginPath();
            ctx.arc(n.x, n.y * (n.rx / n.ry), n.rx, 0, Math.PI * 2);
            ctx.fillStyle = g; ctx.fill();
            ctx.restore();
        });
        stars.forEach(s => {
            const a = s.bright * (0.4 + 0.6 * Math.abs(Math.sin(s.phase + t * s.speed)));
            if (s.glow) {
                const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 5);
                g.addColorStop(0, `rgba(200,235,255,${a * 0.4})`);
                g.addColorStop(1, 'transparent');
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 5, 0, Math.PI * 2);
                ctx.fillStyle = g; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(210,235,255,${a})`; ctx.fill();
            s.x += s.drift;
            if (s.x < -5) s.x = W + 5;
            if (s.x > W + 5) s.x = -5;
        });
        raf = requestAnimationFrame(draw);
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelAnimationFrame(raf);
        else raf = requestAnimationFrame(draw);
    });

    window.addEventListener('resize', () => { resize(); createStars(); });
    resize(); createStars();
    requestAnimationFrame(draw);
})();
</script>

<script>

const urlParams = new URLSearchParams(window.location.search);
const pais = urlParams.get("pais");

function irParaMenu() {
    if (pais) {
        window.location.href = `/menu?pais=${encodeURIComponent(pais)}`;
    } else {
        window.location.href = "/menu";
    }
}

const estadosPorPais = {
    "Brasil":["Espírito Santo","São Paulo","Minas Gerais","Rio de Janeiro","Rio Grande do Sul","Paraná"],
    "Estados Unidos":["Califórnia","Texas","Flórida","Massachusetts","New York","Illinois"],
    "França":["Île-de-France","Auvergne-Rhône-Alpes","Occitanie","Provence-Alpes-Côte d'Azur"],
    "Japão":["Tóquio","Osaka","Kyoto","Hokkaido"],
    "Itália":["Lazio","Lombardia","Toscana","Sicília"],
    "Rússia":["Moscow","Saint Petersburg","Novosibirsk","Tatarstan"],
    "Argentina":["Buenos Aires","Córdoba","Santa Fes","Mendoza"],
    "Portugal":["Lisboa","Porto","Coimbra","Braga"]
};

const temasPais = {
    "Brasil":       { fundo:"/static/imagens/paises/brasil/fundoBR.png"   },
    "Estados Unidos":{ fundo:"/static/imagens/paises/eua/fundoEUA.png"     },
    "França":       { fundo:"/static/imagens/paises/franca/fundoFR.png"   },
    "Japão":        { fundo:"/static/imagens/paises/japao/fundoJP.png"    },
    "Itália":        { fundo:"/static/imagens/paises/italia/fundoIT.png"    },
    "Rússia":        { fundo:"/static/imagens/paises/russia/fundoRU.png"    },
    "Argentina":     { fundo:"/static/imagens/paises/argentina/fundoAR.png" },
    "Portugal":      { fundo:"/static/imagens/paises/portugal/fundoPT.png" }
};

if (temasPais[pais]) {
    document.getElementById("fundoPais").src = temasPais[pais].fundo;
}

function renderizarEstados(filtro = "") {
    const lista = document.getElementById("listaEstados");
    lista.innerHTML = "";
    const estados = estadosPorPais[pais] || [];
    estados
        .filter(e => e.toLowerCase().includes(filtro.toLowerCase()))
        .forEach(estado => {
            const div = document.createElement("div");
            div.className = "estado";
            div.innerHTML = `
                <span class="estado-dot"></span>
                <span class="estado-nome">${estado}</span>
            `;
            div.onclick = () => {
                window.location.href = `/cientistas?pais=${encodeURIComponent(pais)}&estado=${encodeURIComponent(estado)}`;
            };
            lista.appendChild(div);
        });
}

renderizarEstados();

document.getElementById("pesquisa").addEventListener("input", (e) => {
    renderizarEstados(e.target.value);
});

</script>

</body>
</html>
